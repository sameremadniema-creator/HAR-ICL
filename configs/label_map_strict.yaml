# Unified taxonomy + rich physiological descriptions for sentence-BERT.

walk:
  description: "level walking at a steady pace of about 1.4 metres per second with rhythmic arm swing"
  aliases:
    uci_har: ["WALKING"]
    pamap2: ["walking"]
    mhealth: ["walking", "Walking"]
    usc_had: ["walking forward", "walking left", "walking right"]

walk_upstairs:
  description: "walking up a staircase one step at a time with a vertical lift of about 0.18 metres per step"
  aliases:
    uci_har: ["WALKING_UPSTAIRS"]
    pamap2: ["ascending stairs"]
    mhealth: ["climbing stairs", "Climbing stairs"]
    usc_had: ["walking upstairs"]

walk_downstairs:
  description: "walking down a staircase with controlled descent and impact loading on the lower limbs"
  aliases:
    uci_har: ["WALKING_DOWNSTAIRS"]
    pamap2: ["descending stairs"]
    mhealth: []
    usc_had: ["walking downstairs"]

sit:
